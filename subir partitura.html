<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir Partituras</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #141E30, #243B55);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .upload-box {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      padding: 30px;
      width: 380px;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    h2 {
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    input[type="text"],
    input[type="url"],
    input[type="file"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      outline: none;
    }

    input[type="file"] {
      background-color: rgba(255,255,255,0.2);
      color: #fff;
      cursor: pointer;
    }

    button {
      background: #00c3ff;
      color: #fff;
      border: none;
      padding: 12px 20px;
      margin-top: 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }

    button:hover {
      background: #02a3d6;
      transform: translateY(-2px);
    }

    .preview {
      margin-top: 20px;
      border-radius: 10px;
      overflow: hidden;
    }

    .preview img,
    .preview iframe {
      width: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="upload-box">
    <h2>🎵 Subir Partitura</h2>
    <form id="uploadForm">
      <label>Nombre del usuario:</label>
      <input type="text" id="usuario" placeholder="Tu nombre..." required>

      <label>Enlace (YouTube, Drive, etc.):</label>
      <input type="url" id="url" placeholder="https://..." >

      <label>Archivo (PDF / Imagen / Audio):</label>
      <input type="file" id="archivo" accept=".pdf,image/*,audio/*">

      <button type="submit">📤 Enviar</button>
    </form>

    <div class="preview" id="preview"></div>
  </div>

  <script src="/scripts/index.js"></script>
</body>
</html>
