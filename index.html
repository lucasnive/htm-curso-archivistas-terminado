    <nav class="menu">

  <main>

      <img src="bandas/GRANADEROS A CABALLOS.jpg" class="active" alt="Fondo 1">

  <script src="index.js"></script>
  <script>
    
    const fondos = document.querySelectorAll('.fondo-carrusel img');
    let index = 0;
    setInterval(() => {
      fondos[index].classList.remove('active');
      index = (index + 1) % fondos.length;
      fondos[index].classList.add('active');
    }, 6000);
  </script>
