<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVISTAS - Partituras</title>
  <style>
    /* Hacemos que el body ocupe toda la altura y use flex */
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #fff;
      text-align: center;
      background-image: url("/bandas/GRANADEROS A CABALLOS.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      min-height: 100vh; /* altura mínima igual a la ventana */
    }

    header {
      background: rgba(22, 45, 146, 0.7);
      padding: 20px 0;
      box-shadow: 0 4px 10px rgba(208, 255, 0, 0.5);
    }

    header img {
      width: 160px;
      height: auto;
    }

    nav {
      margin-top: 15px;
    }

    nav a {
      text-decoration: none;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 18px;
      border-radius: 10px;
      margin: 5px;
      display: inline-block;
      transition: 0.3s;
      font-weight: bold;
    }

    nav a:hover {
      background: #250ef7;
      color: #000;
      transform: scale(1.1);
    }

    h1 {
      margin-top: 40px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .contenido {
      background: rgba(0, 0, 0, 0.6);
      margin: 40px auto;
      max-width: 900px;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      flex: 1; /* hace que el contenido crezca para empujar el footer al final */
    }

    footer {
      background: rgba(14, 83, 212, 0.8);
      color: #aaa;
      padding: 15px 0;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="/bandas/logo.jpg" alt="Logo Archivistas">
    </div>

    <nav>
      <a href="https://drive.google.com/drive/folders/1z9P8jshGGUhMurgeBX_ypAV3kDrz86oL" target="_blank">Marchas</a>
      <a href="https://drive.google.com/drive/folders/1Y3gB4X6dcPKtX5OrKe726breNVO1nUVd" target="_blank">Himnos</a>
      <a href="https://drive.google.com/drive/folders/11RG75zWSC2LMuy2yef2GRsRs728qf1QI" target="_blank">Populares</a>
      <a href="https://drive.google.com/drive/folders/15tqOvDbuFFsOnxBx5io0ZWjx_EV-3LBy" target="_blank">Reglamentos</a>
       <a href="https://drive.google.com/drive/folders/11EhZoYn3BWXHBqAtAFEc-m0fwEhfIhkr" target="_blank">Descargar Finales</a>
      <a href="subir partitura.html" target="_blank">Subir Partituras</a>
    </nav>
  </header>

  <div class="contenido">
    <h1>Partituras Digitales</h1>
    <p>Bienvenido al archivo musical. Aquí podrás acceder y compartir partituras de marchas, himnos, temas populares y más.</p>
  </div>

  <footer>
    © 2025 Archivistas - Todos los derechos reservados
  </footer>
</body>
</html>
