<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandas Militares de la Nación</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #0a0a0a;
      color: #ffffff;
      text-align: center;
    }

    h1 {
      margin: 20px 0;
      color: #00a2ff;
      letter-spacing: 1px;
      font-size: 2em;
      text-transform: uppercase;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      padding: 30px;
    }

    .banda {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 2px solid rgba(255, 215, 0, 0.3);
    }

    .banda:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
    }

    .banda img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .info {
      padding: 15px;
    }

    .info h2 {
      margin: 0;
      font-size: 1.2em;
      color: #ffd700;
    }

    .info p {
      font-size: 0.9em;
      color: #cccccc;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h1>🎺 Bandas Militares de la Nación 🇦🇷</h1>
  
  <div class="galeria">
    <div class="banda">
      <img src="/bandas/PATRICIO.jpg" alt="Banda Militar 1">
      <div class="info">
        <h2>Banda Militar Nº1</h2>
        <p>Ejército Argentino</p>
      </div>
    </div>

    <div class="banda">
      <img src="/bandas/banda-militar-de-musica-alas-argentinas.jpg" alt="Banda Militar 2">
      <div class="info">
        <h2>Banda Militar Nº2</h2>
        <p>Armada Argentina</p>
      </div>
    </div>

    <div class="banda">
      <img src="/bandas/fuerza aerea.jpg" alt="Banda Militar 3">
      <div class="info">
        <h2>Banda Militar Nº3</h2>
        <p>Fuerza Aérea Argentina</p>
      </div>
    </div>

    <div class="banda">
      <img src="/bandas/gendarmeria.jpg" alt="Banda Militar 4">
      <div class="info">
        <h2>Banda Militar Nº4</h2>
        <p>Gendarmería Nacional</p>
      </div>
    </div>
  </div>
</body>
</html>
